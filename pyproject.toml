[project]
name = "leningrad-epidoc"
version = "0.1.0"
description = "Pipeline for generating an EpiDoc-encoded Leningrad Codex"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "google-genai>=1.0.0",
    "jinja2>=3.0",
    "lxml>=5.0",
    "pyyaml>=6.0",
]

[project.scripts]
leningrad = "leningrad_epidoc.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leningrad_epidoc"]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "types-pyyaml>=6.0.12.20260815",
]
