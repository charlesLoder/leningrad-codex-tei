[build]
  command = "npm run build"
  publish = "dist"
  # Skip Netlify builds unless site/ itself changed (exit 0 = ignore).
  # Edition content ships via tags, which deploy through the build hook
  # fired in .github/workflows/release.yml.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/"

[build.environment]
  NODE_VERSION = "22"
